[pytest]
testpaths = tests
# Quiet the addon's own startup logging, which otherwise prints on every
# mitm_logger import.
log_cli = false
filterwarnings =
    ignore::DeprecationWarning

# Group the verbose output by file with a blank line between, so a run reads
# as "here is what's covered" rather than one long undifferentiated list.
console_output_style = classic
# Show the docstring under each test name: most of these explain WHY the
# behaviour matters (usually a bug that got through once), which is the part
# worth reading.
addopts = -ra
